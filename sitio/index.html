<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1520">
<title>Atlético 47</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atlético 47">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ink:#0E1520;--paper:#EEF1F5;--dim:#8391A3;--line:#243040;--acc:#FFB447;--acc-dk:#C98A2B;--warn:#FF8A3D;--red:#E5484D;--ok:#4BC27A;--card:#17202C}
html{-webkit-text-size-adjust:100%}
body{background:var(--ink);color:var(--paper);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:clamp(15px,4vw,16px);line-height:1.55;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.01em;line-height:.95}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select{font-family:inherit}
header{border-bottom:1px solid var(--line);padding:18px 0 0;margin-bottom:20px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.brand h1{font-size:clamp(26px,7vw,38px);font-weight:700}
.brand h1 em{font-style:normal;color:var(--acc)}
.tag,.mkcal,.when,.num,.slab,.hmeta,.chip,.kgb,.discos,.serie label,.row label,.stat .k,.eqi .u,.item .q,.day .l,.cd,.calh span,.load,footer{font-family:"IBM Plex Mono",ui-monospace,monospace}
.tag{font-size:10px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase}
.tabs{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;font-size:14px;letter-spacing:.04em;color:var(--dim);padding-bottom:11px;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected=true]{color:var(--acc);border-color:var(--acc)}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:4px;flex-wrap:wrap}
.hd h2{font-size:clamp(24px,6vw,32px);font-weight:700}
.sub{color:var(--dim);font-size:13.5px;margin-bottom:18px}
.when{font-size:11px;color:var(--acc);letter-spacing:.08em}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:20px}
.day{border:1px solid var(--line);border-radius:9px;padding:9px 2px;text-align:center;background:var(--card)}
.day .d{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:16px;display:block}
.day .l{font-size:8.5px;color:var(--dim);text-transform:uppercase}
.day[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--ink)}
.day[aria-pressed=true] .l{color:#5A3D0A}
.day.rest .d{color:var(--dim)}
.day[aria-pressed=true].rest .d{color:var(--ink)}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s}
.ex{border:1px solid var(--line);border-radius:13px;margin-bottom:11px;background:var(--card);overflow:hidden}
.exhd{display:flex;align-items:center;gap:11px;padding:15px 16px;width:100%;text-align:left}
.num{font-size:10.5px;color:var(--dim);min-width:18px}
.name{font-weight:600;font-size:16px;flex:1;line-height:1.25}
.kgb{font-size:11.5px;text-align:right;white-space:nowrap}
.kgb b{display:block;font-weight:700;color:var(--acc);font-size:13px}
.kgb span{color:var(--dim)}
.chev{color:var(--dim);font-size:11px;transition:transform .2s}
.ex.open .chev{transform:rotate(90deg)}
.body{display:none;padding:0 16px 16px;border-top:1px solid var(--line)}
.ex.open .body{display:block}
.why{background:rgba(255,180,71,.08);border-left:2px solid var(--acc);padding:9px 11px;font-size:13px;color:#D6DBE3;margin:13px 0}
.why b{color:var(--acc)}
.discos{font-size:12px;color:var(--acc-dk);padding:2px 0 12px}
.cue{color:#C9CFD8;font-size:14px;padding:10px 0}
.breath{display:flex;gap:8px;background:rgba(255,180,71,.06);border-left:2px solid var(--acc);padding:9px 11px;font-size:13px;color:#D6DBE3;margin-bottom:12px}
.err{font-size:12.5px;color:var(--warn);padding:0 0 12px}
.vids{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.vid{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12.5px;color:var(--paper);text-decoration:none;text-align:left}
.vid:hover{border-color:var(--acc);color:var(--acc)}
.vid i{color:var(--red);font-size:10px;font-style:normal}
.vid.duele{border-color:var(--warn);color:var(--warn)}
.slab{font-size:9.5px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;width:100%;margin:6px 0 2px}
.sets{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.serie{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:6px 8px}
.serie.ok{border-color:var(--acc);background:rgba(255,180,71,.07)}
.serie label{font-size:10px;color:var(--dim)}
.serie input{background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px;color:var(--paper);font-family:"IBM Plex Mono",monospace;font-size:14px;width:46px;text-align:center}
.rest-btn{font-family:"IBM Plex Mono",monospace;font-size:11.5px;border:1px solid var(--line);border-radius:9px;padding:10px 13px}
.rest-btn:hover{border-color:var(--acc)}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.row label{font-size:9.5px;color:var(--dim);letter-spacing:.09em;text-transform:uppercase}
.inp{background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:10px 11px;color:var(--paper);font-family:"IBM Plex Mono",monospace;font-size:14px}
.inp:focus{outline:none;border-color:var(--acc)}
input.nota{background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:10px 11px;color:var(--paper);font-size:13.5px;width:100%;font-family:"IBM Plex Sans",sans-serif}
input.nota:focus{outline:none;border-color:var(--acc)}
.chk{width:19px;height:19px;accent-color:var(--acc);vertical-align:-4px;margin-right:6px}
.btn{background:var(--acc);color:var(--ink);border-radius:10px;padding:13px 18px;font-weight:700;font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;font-size:15px;letter-spacing:.04em}
.btn.gh{background:none;border:1px solid var(--line);color:var(--paper);font-family:"IBM Plex Sans",sans-serif;font-weight:500;text-transform:none;letter-spacing:0;font-size:13px}
.btn.gh:hover{border-color:var(--acc)}
.btn.sm{padding:9px 13px;font-size:13px}
.btn.rojo{border-color:var(--red);color:var(--red)}
.note{border:1px dashed var(--line);border-radius:12px;padding:15px 16px;margin:22px 0;font-size:13.5px;color:#C9CFD8}
.note b{color:var(--acc);font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;font-size:14px;letter-spacing:.04em;display:block;margin-bottom:5px}
.note.w{border-style:solid;border-color:var(--warn)}
.note.w b{color:var(--warn)}
.note.r{border-style:solid;border-color:var(--red)}
.note.r b{color:var(--red)}
.rest-day{text-align:center;padding:40px 18px;color:var(--dim)}
.rest-day p{max-width:46ch;margin:9px auto 0;font-size:14px}
h3.sec{font-size:16px;color:var(--paper);margin:26px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--line);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;margin-bottom:18px}
.stat{background:var(--card);border-radius:11px;padding:13px 14px}
.stat .v{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:26px;color:var(--acc);line-height:1}
.stat .v small{font-size:13px;color:var(--dim)}
.stat .k{font-size:9.5px;color:var(--dim);letter-spacing:.09em;text-transform:uppercase;margin-top:5px}
.eq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 4px;margin-bottom:11px}
.eqi{display:flex;align-items:center;gap:11px;padding:9px 13px}
.eqi input[type=checkbox]{width:19px;height:19px;accent-color:var(--acc);flex-shrink:0}
.eqi label{flex:1;cursor:pointer;font-size:14.5px}
.eqi input[type=checkbox]:not(:checked)+label{color:var(--dim)}
.eqi .inp{width:74px;padding:7px 9px;font-size:13px}
.eqi .u{font-size:10px;color:var(--dim)}
.hist{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.hist h4{font-size:15px;font-weight:600;margin-bottom:3px}
.hline{display:flex;align-items:flex-end;gap:3px;height:44px;margin:11px 0 7px}
.hbar{flex:1;background:var(--acc-dk);border-radius:2px 2px 0 0;min-height:3px}
.hbar:last-child{background:var(--acc)}
.hmeta{font-size:10.5px;color:var(--dim);display:flex;justify-content:space-between}
.pre{white-space:pre-wrap;font-family:"IBM Plex Sans",sans-serif;font-size:13.5px;color:#C9CFD8;line-height:1.7}
.mtime{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--acc)}
.chip{font-size:9.5px;border:1px solid var(--line);border-radius:5px;padding:2px 6px;margin-left:5px;color:var(--dim)}
.item{display:flex;align-items:center;gap:11px;padding:8px 13px;font-size:14px}
.item input{width:19px;height:19px;accent-color:var(--acc);flex-shrink:0}
.item label{flex:1;cursor:pointer}
.item .q{font-size:10.5px;color:var(--dim)}
.item input:checked+label{color:var(--dim);text-decoration:line-through}
.mesT{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;font-size:16px;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px}
.cd{aspect-ratio:1;border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--dim);background:var(--card);position:relative}
.cd.hay{border-color:var(--acc-dk);color:var(--paper)}
.cd.val{background:var(--acc);color:var(--ink);border-color:var(--acc);font-weight:700}
.cd.pad{border-color:var(--ok);color:var(--paper)}
.cd.hoy{outline:2px solid var(--acc);outline-offset:1px}
.cd.no{opacity:.22;border-style:dashed}
.cd i{font-style:normal;font-size:8px;position:absolute;bottom:4px}
.calh{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.calh span{text-align:center;font-size:9px;color:var(--dim);text-transform:uppercase}
.msg{border-radius:12px;padding:12px 14px;margin-bottom:9px;font-size:14.5px;line-height:1.55}
.msg.u{background:var(--card);border:1px solid var(--line);margin-left:32px}
.msg.a{background:rgba(255,180,71,.07);border-left:2px solid var(--acc);margin-right:16px}
.sug{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.sug button{border:1px solid var(--line);border-radius:16px;padding:8px 13px;font-size:12.5px;color:var(--dim);text-align:left}
.sug button:hover{border-color:var(--acc);color:var(--acc)}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
#timer,#guia{position:fixed;left:0;right:0;bottom:0;background:var(--acc);color:var(--ink);padding:14px 16px calc(14px + env(safe-area-inset-bottom));display:none;align-items:center;gap:14px;z-index:60}
#timer.on{display:flex}
#guia.on{display:flex;flex-wrap:wrap;gap:6px 14px}
#tnum,#gT{font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:31px;font-variant-numeric:tabular-nums}
#tlab,#gN{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;font-weight:700;font-size:15px;flex:1;line-height:1.2}
#gC{width:100%;font-size:13px;line-height:1.4}
#timer button,#guia button{border:1.5px solid var(--ink);border-radius:8px;padding:8px 13px;font-weight:600;font-size:13.5px}
footer{border-top:1px solid var(--line);margin-top:30px;padding:16px 0 24px;font-size:10.5px;color:var(--dim)}
.load{text-align:center;padding:50px;color:var(--dim);font-size:12px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:var(--acc);color:var(--ink);padding:13px 20px;border-radius:11px;font-weight:600;font-size:14px;z-index:80;opacity:0;pointer-events:none;transition:opacity .25s;max-width:88%;text-align:center}
#toast.on{opacity:1}
#toast.bad{background:var(--warn)}
#modal{position:fixed;inset:0;background:rgba(6,9,14,.86);display:none;align-items:center;justify-content:center;z-index:90;padding:20px}
#modal.on{display:flex}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:22px;max-width:400px;width:100%}
.mbox p{font-size:15px;margin-bottom:18px;line-height:1.5}
.mbox .row{justify-content:flex-end;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="brand"><h1>Atlético<em>47</em></h1><span class="tag" id="today"></span></div>
<nav class="tabs" role="tablist">
<button class="tab" role="tab" data-t="hoy" aria-selected="true" onclick="vw('hoy')">Hoy</button>
<button class="tab" role="tab" data-t="tr" aria-selected="false" onclick="vw('tr')">Entreno</button>
<button class="tab" role="tab" data-t="hi" aria-selected="false" onclick="vw('hi')">Progreso</button>
<button class="tab" role="tab" data-t="pa" aria-selected="false" onclick="vw('pa')">Pádel</button>
<button class="tab" role="tab" data-t="cu" aria-selected="false" onclick="vw('cu')">Cuerpo</button>
<button class="tab" role="tab" data-t="co" aria-selected="false" onclick="vw('co')">Comida</button>
<button class="tab" role="tab" data-t="ai" aria-selected="false" onclick="vw('ai')">Coach</button>
<button class="tab" role="tab" data-t="aj" aria-selected="false" onclick="vw('aj')">Ajustes</button>
</nav>
</header>
<div id="app" class="load">Cargando tus datos…</div>
<section id="hoy" hidden></section>
<section id="tr" hidden>
<nav class="days" id="days" aria-label="Días"></nav>
<div class="hd"><h2 id="tt"></h2><span class="when" id="when"></span></div>
<p class="sub" id="ss"></p>
<div class="bar"><i id="prog"></i></div>
<div id="main"></div>
</section>
<section id="hi" hidden></section>
<section id="pa" hidden></section>
<section id="cu" hidden></section>
<section id="co" hidden></section>
<section id="ai" hidden></section>
<section id="aj" hidden></section>
<footer id="foot"></footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal"><div class="mbox"><p id="mtxt"></p><div class="row"><button class="btn gh sm" onclick="mNo()">Cancelar</button><button class="btn sm" onclick="mSi()">Confirmar</button></div></div></div>
<div id="timer" role="status" aria-live="polite"><span id="tnum">2:00</span><span id="tlab">Descanso</span><button onclick="addT(30)">+30s</button><button onclick="stopT()">Saltar</button></div>
<div id="guia" role="status" aria-live="polite"><span id="gT">1:00</span><span id="gN"></span><button onclick="saltarG()">Siguiente</button><button onclick="pararG()">Parar</button><span id="gC"></span></div>
<!-- storage-remote.js define window.storage y sincroniza con la Raspberry.
     Si no carga, la app sigue funcionando contra localStorage. -->
<script src="storage-remote.js"></script>
<script src="biblioteca.js"></script>
<script src="motor.js"></script>
<script src="app.js"></script>
</body>
</html>
