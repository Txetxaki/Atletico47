<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Monoton&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0B0712}
.ic{width:512px;height:512px;background:#0B0712;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.ic svg{width:512px;height:512px;display:block}
.ic.masc #art{transform-origin:256px 256px;transform:scale(.7)}
</style></head>
<body>
<div class="ic" id="ic">
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="disco" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#231A38"/>
      <stop offset="70%" stop-color="#150F24"/>
      <stop offset="100%" stop-color="#0B0712"/>
    </radialGradient>
    <radialGradient id="label" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6FE0"/>
      <stop offset="100%" stop-color="#FF2FD4"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="#0B0712"/>
  <g id="art">
    <!-- vinyl record -->
    <circle cx="256" cy="256" r="210" fill="url(#disco)" stroke="#2C2148" stroke-width="4"/>
    <circle cx="256" cy="256" r="182" fill="none" stroke="#241B3A" stroke-width="2"/>
    <circle cx="256" cy="256" r="158" fill="none" stroke="#241B3A" stroke-width="2"/>
    <circle cx="256" cy="256" r="134" fill="none" stroke="#241B3A" stroke-width="2"/>
    <circle cx="256" cy="256" r="110" fill="none" stroke="#241B3A" stroke-width="2"/>
    <!-- label -->
    <circle cx="256" cy="256" r="86" fill="url(#label)"/>
    <circle cx="256" cy="256" r="86" fill="none" stroke="#0B0712" stroke-width="3"/>
    <circle cx="256" cy="256" r="10" fill="#0B0712"/>
    <text x="256" y="273" font-family="Monoton, 'Barlow Condensed', sans-serif" font-size="60" fill="#F3EEFB" text-anchor="middle">OG</text>
    <!-- tonearm -->
    <g stroke-linecap="round">
      <circle cx="396" cy="120" r="22" fill="none" stroke="#22E7FF" stroke-width="10"/>
      <line x1="384" y1="135" x2="300" y2="222" stroke="#22E7FF" stroke-width="10"/>
      <line x1="300" y1="222" x2="318" y2="248" stroke="#22E7FF" stroke-width="10"/>
      <circle cx="318" cy="248" r="8" fill="#F3EEFB"/>
    </g>
  </g>
</svg>
</div>
<script>
var q=new URLSearchParams(location.search);
if(q.get('masc'))document.getElementById('ic').className='ic masc';
var s=parseInt(q.get('s'))||512;
document.body.style.zoom=s/512;
</script>
</body></html>
